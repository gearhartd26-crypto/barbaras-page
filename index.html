<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbara's Memory Lane</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Matches your exact file name: Bgblue.jpg */
            background-image: url('Bgblue.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Fixed Top Video Header */
        .video-header {
            width: 100%;
            max-width: 500px;
            background-color: #000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            position: sticky;
            top: 0;
            z-index: 1000;
            aspect-ratio: 16 / 9;
        }

        .video-header iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Main Profile Card Container */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95); /* Semi-transparent white card */
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 450px;
            width: 90%;
        }

        /* Main Content Container */
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
            margin-top: 30px; 
            margin-bottom: 40px;
            box-sizing: border-box;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 2em;
        }

        p {
            color: #7f8c8d;
            font-size: 1.1em;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="video-header">
        <iframe 
            src="https://www.youtube.com/embed/BRPGRdbGHSs" 
            title="YouTube video player" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            allowfullscreen>
        </iframe>
    </div>

    <div class="container">
        <h1>Welcome to Barbara's Page</h1>
        <p>Press play on the video at the top of the screen to watch and listen to the music directly from this page.</p>
    </div>

</body>
</html>
