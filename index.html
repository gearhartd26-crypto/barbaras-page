<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbara's HTML Page</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('bgblue.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            /* Prevents the entire page from ever scrolling sideways */
            overflow-x: hidden; 
        }

        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%; /* Changed from 100% to 90% so it has a nice edge on mobile */
            /* Tells the browser to include padding in the width so it doesn't expand */
            box-sizing: border-box; 
            margin: 20px auto;
        }

        h1 {
            color: #2c3e50;
            font-size: 1.8em;
        }

        p {
            color: #7f8c8d;
        }

        /* Makes sure the video wrapper never spills out */
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            max-width: 100%;
            background: #000;
            border-radius: 4px;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome, Barbara!</h1>
        <p>This is your brand new interactive HTML page hosted on GitHub Pages.</p>
        
        <div class="video-wrapper">
            <iframe src="https://www.youtube.com/embed/BRPGRdbGHSs" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>
    </div>
</body>
</html>
