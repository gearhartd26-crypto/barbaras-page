<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbara's Memory Lane</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Searches the exact same folder for your background file */
            background-image: url('Bgblue.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Fixed Top Video Header */
        .video-header {
            width: 100%;
            max-width: 500px;
            background-color: #000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            position: sticky;
            top: 0;
            z-index: 1000;
            aspect-ratio: 16 / 9;
        }

        .video-header iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Main Profile Card Container */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95); /* Semi-transparent white card */
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 450px;
            width: 90%;
            margin-top: 25px; 
            margin-bottom: 35px;
            box-sizing: border-box;
        }

        .profile-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
