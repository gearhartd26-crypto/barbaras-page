<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbara's HTML Page</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Top Bar */
        .top-bar {
            width: 100%;
            background-color: #2c3e50;
            color: white;
            padding: 12px 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            box-sizing: border-box;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .bar-title {
            font-size: 0.9em;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        /* Main Content Container */
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
            margin-top: 60px; 
            box-sizing: border-box;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 2em;
        }

        p {
            color: #7f8c8d;
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* YouTube Music Button */
        .music-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: #e63946;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1em;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.2s, transform 0.2s;
        }

        .music-btn:active {
            background-color: #cb2d3a;
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <span class="bar-title">✨ Welcome to Barbara's Special Website</span>
    </div>

    <div class="container">
        <h1>Welcome to Barbara's Page</h1>
        <p>This space is dedicated to Barbara. Click the button below to open and listen to the official music video for her favorite song on YouTube.</p>
        
        <a href="http://www.youtube.com/watch?v=BRPGRdbGHSs" target="_blank" class="music-btn">
            🎵 Play "I Can Only Imagine" on YouTube
        </a>
    </div>

</body>
</html>
