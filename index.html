<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbara's HTML Page</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Top Music Control Bar */
        .music-bar {
            width: 100%;
            background-color: #2c3e50;
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            box-sizing: border-box;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .music-label {
            font-size: 0.9em;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .top-player {
            height: 32px;
            border-radius: 5px;
        }

        /* Main Content Container */
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
            margin-top: 60px; 
            box-sizing: border-box;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 2em;
        }

        p {
            color: #7f8c8d;
            font-size: 1.1em;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="music-bar">
        <span class="music-label">🎵 Now Playing: I Can Only Imagine</span>
        <audio class="top-player" controls>
            <source src="ICanOnlyImagine.MP3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </div>

    <div class="container">
        <h1>Welcome to Barbara's Page</h1>
        <p>Use the control bar at the top to play, pause, or adjust the volume of the background music whenever you like.</p>
    </div>

</body>
</html>
